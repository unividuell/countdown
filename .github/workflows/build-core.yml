name: build-core
on:
  workflow_dispatch: {}
  # PRs run the test gate only — the image steps below are skipped, so a PR never
  # publishes to ghcr (a non-main ref would resolve to and clobber :staging).
  pull_request:
    branches: [main, develop]
    paths:
      - 'core/**'
      - '.github/workflows/build-core.yml'
  push:
    branches: [main, develop]
    paths:
      - 'core/**'
      - '.github/workflows/build-core.yml'
permissions:
  contents: read
  packages: write
jobs:
  # Job id doubles as the check name on a PR — keep it distinct per workflow ('image'
  # in both showed up as two identical checks) and name the component, not the action:
  # on a pull_request this job verifies and builds no image at all.
  core:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Run the full suite FIRST (incl. Testcontainers + ModularityTests) so a red test
      # fails the job before any image is built/published. Explicit, not relying on
      # build-image's implicit fork to the package phase.
      - name: Test (gate before image)
        working-directory: core
        run: ./mvnw -B clean verify
      - name: Resolve image tag
        if: github.event_name != 'pull_request'
        id: tag
        run: echo "tag=${{ github.ref_name == 'main' && 'latest' || 'staging' }}" >> "$GITHUB_OUTPUT"
      - name: Build & publish image (Buildpacks -> ghcr)
        if: github.event_name != 'pull_request'
        working-directory: core
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -DskipTests: the suite already ran in the gate step above; don't run it twice.
        # countdown.image.tag parametrizes the pom's <image><name> (the build-image.imageName
        # user property does NOT override a pom-set name in this plugin version).
        run: >
          ./mvnw -B spring-boot:build-image -DskipTests
          -Dcountdown.image.tag=${{ steps.tag.outputs.tag }}
          -Dspring-boot.build-image.publish=true
