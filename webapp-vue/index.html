<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webapp-vue</title>
    <style>
      /* The app now resolves its first route before mounting, so #app is empty for a
         moment longer. Paint the page background up front rather
         than flashing white. */
      /* Twin of --color-surface in src/assets/main.css. */
      html {
        color-scheme: light dark;
      }
      html[data-color-scheme='light'] {
        color-scheme: light;
      }
      html[data-color-scheme='dark'] {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: light-dark(#f7f5f1, #44403c);
      }
    </style>
    <script>
      // The user's light/dark pick, pinned before the first paint. Twin of src/ui/colorScheme.ts.
      try {
        const scheme = localStorage.getItem('color-scheme')
        if (scheme === 'light' || scheme === 'dark')
          document.documentElement.dataset.colorScheme = scheme
      } catch {
        // No storage (denied cookies, sandboxed frame): follow the system.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
