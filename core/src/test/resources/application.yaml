spring:
  datasource:
    hikari:
      # Every @SpringBootTest context holds its own pool against the one shared Postgres for the
      # whole run (see TestcontainersConfiguration), so the default of ten per context multiplies
      # by the number of contexts. A test uses one connection at a time; five is slack.
      maximum-pool-size: 5
  modulith:
    runtime:
      flyway-enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: read:user
  session:
    jdbc:
      initialize-schema: never

app:
  test-auth:
    enabled: true
  game-lab:
    # This file REPLACES the main application.yaml on the test classpath — without this key the
    # lab beans are absent from every test context and the conditions never match.
    enabled: true

countdown:
  public-rate-limit:
    # Effectively unlimited: the counter is a shared singleton keyed by client address, and every
    # test in the default context shares one address (none of them set X-Client-IP) — the
    # production default would fail unrelated tests once enough of them hit the guarded paths.
    # PublicRateLimitFilterTest overrides this per-context via @SpringBootTest(properties = [...]),
    # which wins over this file.
    permits-per-minute: 1000000
