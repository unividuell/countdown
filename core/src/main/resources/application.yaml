spring:
  application:
    name: core
  docker:
    compose:
      # compose.yaml lives at the repo root, one level above this module. Without this the
      # lifecycle manager looks in the process working directory and fails the boot with
      # "No Docker Compose file found". The path is relative to that same working directory,
      # which is `core/` for `./mvnw spring-boot:run` — the Maven project's own directory — but
      # the *project root* for an IDE run configuration, where `../` points above the repo and
      # the boot dies with "'files' content [../compose.yaml] must exist" instead. An IDE
      # configuration therefore has to set its working directory to `core/`; the shared one in
      # `.run/CoreApplication.run.xml` does. Inert outside local dev: spring-boot-maven-plugin's
      # `excludeDockerCompose` defaults to true, so the packaged image has no
      # docker-compose support at all, and the support skips itself in tests.
      file: ../compose.yaml
  modulith:
    runtime:
      flyway-enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: Ov23liQzcbT4kLUIXWoo
            # Local dev logs in through the seeded test-user picker (see app.test-auth),
            # which never performs a token exchange — so a placeholder keeps the documented
            # local flow running without exporting anything. Production overrides both this
            # and the client-id in application-production.yaml, where the secret has NO
            # default and a missing env var still fails the boot fast.
            client-secret: ${GITHUB_CLIENT_SECRET:local-dev-unused}
            scope: read:user
  session:
    jdbc:
      initialize-schema: never

app:
  super-admin-github-logins: ${SUPER_ADMIN_GITHUB_LOGINS:}
  guess-hue:
    # Empty means: the sample dataset from the classpath — a boot failure in production/staging,
    # where update.sh decrypts the real file with sops and compose mounts it into the container.
    # Locally it stays empty only on a machine without the age key: `.claude/launch.json` fills it
    # from `scripts/guess-hue-dataset.sh dev-path`, which answers empty when it cannot decrypt.
    dataset-path: ${GUESS_HUE_DATASET_PATH:}
  song-snippet:
    # Finding ids: the number in a playlist's web URL IS the id —
    # https://www.deezer.com/playlist/10457025082. To go looking, the API needs no key, and the
    # editor's own catalogue is the best entry point, because everything in it is editorial:
    #   curl -s 'https://api.deezer.com/playlist/10457025082'        # -> creator.id 374224155
    #   curl -s 'https://api.deezer.com/user/374224155/playlists?limit=200'   # 169 lists
    # Free-text search works too, where `user.name` separates an editorial list ("Deezer <country>
    # Editor") from somebody's private mixtape:
    #   curl -s --get https://api.deezer.com/search/playlist --data-urlencode 'q=deine Hits'
    playlist-ids:
      - 10457025082 # Deutschland, deine Hits - 80er (fans: 7840)
      - 10453961322 # Deutschland, deine Hits - 90er (fans: 7581)
      - 10396822102 # Deutschland, deine Hits - 00er (fans: 5843)
      - 10396828062 # Deutschland, deine Hits - 10er (fans: 3949)
      - 11605921024 # Deutschland, deine Sommer Hits - 20er (fans: 650)
  test-auth:
    # Emulator-style test login (seeded users + picker). Default on for localhost.
    # Set false to replay the real prod GitHub OAuth flow locally (no seed, no picker).
    enabled: true
  game-lab:
    # The non-prod harness for playing a mini-game against a seed from the URL. Gated twice, like
    # test-auth: the beans are also @Profile("!production"). The switch exists so staging can be
    # closed the day real testers play a real round there — no code change, no deploy rebuild.
    enabled: true
