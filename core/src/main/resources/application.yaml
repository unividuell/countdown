spring:
  application:
    name: core
  docker:
    compose:
      # compose.yaml lives at the repo root, one level above this module. Without this the
      # lifecycle manager looks in the process working directory (`core/`, for both
      # `./mvnw spring-boot:run` and an IDE run config) and fails the boot with
      # "No Docker Compose file found". The path is relative to that same working
      # directory. Inert outside local dev: spring-boot-maven-plugin's
      # `excludeDockerCompose` defaults to true, so the packaged image has no
      # docker-compose support at all, and the support skips itself in tests.
      file: ../compose.yaml
  modulith:
    runtime:
      flyway-enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: Ov23liQzcbT4kLUIXWoo
            # Local dev logs in through the seeded test-user picker (see app.test-auth),
            # which never performs a token exchange — so a placeholder keeps the documented
            # local flow running without exporting anything. Production overrides both this
            # and the client-id in application-production.yaml, where the secret has NO
            # default and a missing env var still fails the boot fast.
            client-secret: ${GITHUB_CLIENT_SECRET:local-dev-unused}
            scope: read:user
  session:
    jdbc:
      initialize-schema: never

app:
  super-admin-github-logins: ${SUPER_ADMIN_GITHUB_LOGINS:}
  guess-hue:
    # Empty means: the sample dataset from the classpath — a boot failure in production/staging,
    # where update.sh decrypts the real file with sops and compose mounts it into the container.
    # Locally it stays empty only on a machine without the age key: `.claude/launch.json` fills it
    # from `scripts/guess-hue-dataset.sh dev-path`, which answers empty when it cannot decrypt.
    dataset-path: ${GUESS_HUE_DATASET_PATH:}
  song-snippet:
    # Public Deezer editorial playlists the pool merges ("Deutschland, deine Hits" 00er + 10er).
    # A public catalogue, not game content — no sops, unlike guess-hue.
    playlist-ids: 10396822102,10396828062
  test-auth:
    # Emulator-style test login (seeded users + picker). Default on for localhost.
    # Set false to replay the real prod GitHub OAuth flow locally (no seed, no picker).
    enabled: true
  game-lab:
    # The non-prod harness for playing a mini-game against a seed from the URL. Gated twice, like
    # test-auth: the beans are also @Profile("!production"). The switch exists so staging can be
    # closed the day real testers play a real round there — no code change, no deploy rebuild.
    enabled: true
