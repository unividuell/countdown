spring:
  application:
    name: core
  config:
    # Local dev secrets in one place: `.env` at the repo root is already gitignored and already
    # read by docker compose, so the Google keys live next to the ports instead of in a second
    # file (or, worse, in the shared `.run`/launch configurations, which ARE tracked).
    # `[.properties]` tells Boot how to parse an extensionless file; `optional:` makes a machine
    # without one boot normally, which is every deployed environment — there compose passes the
    # same names as real environment variables. The relative path is resolved against the process
    # working directory, `core/`, for the same reason `spring.docker.compose.file` below is.
    # Tests never see it: `src/test/resources/application.yaml` replaces this file wholesale.
    import: optional:file:../.env[.properties]
  docker:
    compose:
      # compose.yaml lives at the repo root, one level above this module. Without this the
      # lifecycle manager looks in the process working directory and fails the boot with
      # "No Docker Compose file found". The path is relative to that same working directory,
      # which is `core/` for `./mvnw spring-boot:run` — the Maven project's own directory — but
      # the *project root* for an IDE run configuration, where `../` points above the repo and
      # the boot dies with "'files' content [../compose.yaml] must exist" instead. An IDE
      # configuration therefore has to set its working directory to `core/`; the shared one in
      # `.run/CoreApplication.run.xml` does. Inert outside local dev: spring-boot-maven-plugin's
      # `excludeDockerCompose` defaults to true, so the packaged image has no
      # docker-compose support at all, and the support skips itself in tests.
      file: ../compose.yaml
  modulith:
    runtime:
      flyway-enabled: true
  session:
    jdbc:
      initialize-schema: never
  servlet:
    # Boot's default is 1MB, which would reject every real upload. Must stay >= imagepool's
    # maxBytes (ImagePoolProperties, 15 MB).
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

unividuell:
  auth:
    roles:
      # provider:login, comma-separated: test:<login> for a test user, github:<login> in production.
      # An entry without its provider prefix refuses to start; empty means nobody.
      super-admin: ${SUPER_ADMINS:}
    test-login:
      # The key that unlocks the test-user picker, once per browser profile. Empty means no lock —
      # allowed only while no profile is active, i.e. on localhost, where multi-user testing means
      # several browser profiles at once. The one place where env name and property path differ.
      # unividuell.auth.test-login.enabled=false replays the real GitHub flow (core/README.md).
      key: ${FAKE_SIGN_IN_KEY:}
    csrf-cookie:
      # Answered publicly cacheable to crawlers: a Set-Cookie there would defeat every shared cache.
      excluded-paths: /api/preview/**

app:
  guess-hue:
    # Empty means: the sample dataset from the classpath — a boot failure in production/staging,
    # where update.sh decrypts the real file with sops and compose mounts it into the container.
    # Locally it stays empty only on a machine without the age key: `.claude/launch.json` fills it
    # from `scripts/guess-hue-dataset.sh dev-path`, which answers empty when it cannot decrypt.
    dataset-path: ${GUESS_HUE_DATASET_PATH:}
  song-snippet:
    # Finding an id — the API needs no key:
    #   A) search:  curl -s --get https://api.deezer.com/search/playlist --data-urlencode 'q=deine Hits'
    #   B) known:   the number in the URL, https://www.deezer.com/playlist/12873087061
    # Usable tracks (readable + preview, as DeezerSongCatalog filters; depends on the caller's country):
    #   curl -s 'https://api.deezer.com/playlist/<id>/tracks?limit=400' \
    #     | jq '{total, usable: [.data[] | select(.readable and (.preview // "") != "")] | length}'
    playlist-ids:
      - 12873087061 # HütteHütte (178/201 usable, 2026-10-03)
  spot-object:
    # Empty means: the sample list from the classpath — a boot failure in production/staging,
    # where update.sh decrypts the real file with sops and compose mounts it in. Same shape as
    # guess-hue above.
    terms-path: ${SPOT_OBJECT_TERMS_PATH:}
    # The browser key for the Maps JavaScript API. Referrer-restricted, so it is handed to the
    # client; without it the board cannot load a map at all.
    maps-api-key: ${SPOT_OBJECT_MAPS_API_KEY:}
    # A separate, IP-restricted key for the backend's own server-to-server calls (GoogleCountryLookup).
    # A referrer-restricted key would reject these outright — they carry no Referer header.
    server-maps-api-key: ${SPOT_OBJECT_SERVER_MAPS_API_KEY:}
    # The URL-signing secret for the Street View Static API. Server-side only.
    signing-secret: ${SPOT_OBJECT_SIGNING_SECRET:}
  game-lab:
    # The non-prod harness for playing a mini-game against a seed from the URL. Gated twice, like
    # the test login: the beans are also @Profile("!production"). The switch exists so staging can be
    # closed the day real testers play a real round there — no code change, no deploy rebuild.
    enabled: true
