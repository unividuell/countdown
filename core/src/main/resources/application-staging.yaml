spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/app
    username: admin
    password: ${POSTGRES_PASSWORD}
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
app:
  test-auth:
    enabled: true
  game-lab:
    enabled: true
  stub-points:
    # The only environment that turns invented game points on. Staging runs the seeded test users
    # anyway, so the numbers claim nothing about real players — and with all-zero points the ranking
    # row cannot be judged at all, which is what staging is for.
    enabled: true
