spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/app
    username: admin
    password: ${POSTGRES_PASSWORD}
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
unividuell:
  auth:
    test-login:
      # No default, unlike the base application.yaml: staging runs the real datasets on a public
      # URL. The auth lib additionally refuses to start when this binds empty — Compose passes a
      # missing variable through as an empty string, which a bare `${...}` would not catch.
      key: ${FAKE_SIGN_IN_KEY}
app:
  game-lab:
    enabled: true
  spot-object:
    # No default, unlike the base application.yaml: a missing key/secret fails the boot instead
    # of shipping a board that cannot draw a map or sign a still-image URL.
    maps-api-key: ${SPOT_OBJECT_MAPS_API_KEY}
    server-maps-api-key: ${SPOT_OBJECT_SERVER_MAPS_API_KEY}
    signing-secret: ${SPOT_OBJECT_SIGNING_SECRET}

logging:
  structured:
    format:
      # One JSON object per line, stack trace included: the collector reads it from docker's log file.
      console: ecs

# Metrics and traces go to edge-caddy's edge-lgtm over the shared `monitoring` network
# (deploy/compose.yaml). Unreachable, the exporters only log a warning and drop the batch.
management:
  opentelemetry:
    resource-attributes:
      "[deployment.environment.name]": staging
    tracing:
      export:
        otlp:
          endpoint: http://edge-lgtm:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://edge-lgtm:4318/v1/metrics
