spring:
  security:
    oauth2:
      client:
        registration:
          github:
            # The organisation's GitHub App, shared by every unividuell app (up to ten callback URLs,
            # https://countdown.unividuell.org/login/oauth2/code/github among them). Public client
            # ID — safe to commit. The matching secret comes from ${GITHUB_CLIENT_SECRET}.
            client-id: Iv23liJTgm6EeJ6XshRh
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user
  datasource:
    url: jdbc:postgresql://postgres:5432/app
    username: admin
    password: ${POSTGRES_PASSWORD}

server:
  # Caddy terminates TLS and forwards X-Forwarded-*; honour it so the app builds
  # correct https://countdown.unividuell.org URLs (OAuth redirect_uri) and treats
  # requests as secure.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

unividuell:
  auth:
    test-login:
      # Belt and braces: the auth lib never starts the test login under `production` anyway.
      enabled: false

app:
  game-lab:
    # Belt and braces: the beans are @Profile("!production") too. Two gates because the cost is a
    # line of yaml and the failure mode is unlimited practice against real puzzle content.
    enabled: false
  spot-object:
    # No default, unlike the base application.yaml: a missing key/secret fails the boot instead
    # of shipping a board that cannot draw a map or sign a still-image URL.
    maps-api-key: ${SPOT_OBJECT_MAPS_API_KEY}
    server-maps-api-key: ${SPOT_OBJECT_SERVER_MAPS_API_KEY}
    signing-secret: ${SPOT_OBJECT_SIGNING_SECRET}

logging:
  structured:
    format:
      # One JSON object per line, stack trace included: the collector reads it from docker's log file.
      console: ecs

# Metrics and traces go to edge-caddy's edge-lgtm over the shared `monitoring` network
# (deploy/compose.yaml). Unreachable, the exporters only log a warning and drop the batch.
management:
  opentelemetry:
    resource-attributes:
      "[deployment.environment.name]": production
    tracing:
      export:
        otlp:
          endpoint: http://edge-lgtm:4318/v1/traces
  tracing:
    export:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: true
        url: http://edge-lgtm:4318/v1/metrics
