services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # postgres:18 moved the data dir into a version subdir and the mount point
      # to /var/lib/postgresql (NOT .../data) — mounting .../data makes 18 refuse
      # to start ("data in unused mount/volume"). Mount the parent.
      - pgdata:/var/lib/postgresql
    networks:
      - internal

  db-backup:
    image: postgres:18
    # long-running backup loop (not one-shot) — keep it alive across crashes/restarts
    restart: unless-stopped
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - IMAGE_BACKUP_KEEP=${IMAGE_BACKUP_KEEP:-8}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eo pipefail
        while true; do
          until pg_isready -h postgres -U admin -d app; do sleep 2; done

          # The daily dump keeps the images' table DEFINITION but not its rows: a restore from
          # this file alone yields a running app with an empty pool, rather than one that trips
          # over a missing schema on every image request.
          pg_dump -h postgres -U admin -d app --exclude-table-data=imagepool.images \
            | gzip > "/backups/app-$$(date +%Y%m%d-%H%M%S).sql.gz"
          find /backups -name 'app-*.sql.gz' -mtime +7 -delete

          # Images are ~800 MB per stack and change a few times a year, so the trigger is a
          # fingerprint rather than a schedule -- an unchanged pool costs one query over ~490 rows.
          # to_regclass is empty before the app has migrated, which is the state right after this
          # compose file is deployed.
          if [ -n "$$(psql -h postgres -U admin -d app -tAc "SELECT to_regclass('imagepool.images')")" ]; then
            fingerprint=$$(psql -h postgres -U admin -d app -tAc \
              "SELECT count(*) || '-' || coalesce(md5(string_agg(id::text, ',' ORDER BY id)), '0') FROM imagepool.images")
            if [ "$$fingerprint" != "$$(cat /backups/images.fingerprint 2>/dev/null)" ]; then
              pg_dump -h postgres -U admin -d app --data-only --table=imagepool.images \
                | gzip > "/backups/images-$$(date +%Y%m%d-%H%M%S).sql.gz"
              printf '%s' "$$fingerprint" > /backups/images.fingerprint
              # Retention counts CHANGES, not days: keep the newest IMAGE_BACKUP_KEEP states.
              ls -1t /backups/images-*.sql.gz | tail -n +$$((IMAGE_BACKUP_KEEP + 1)) | xargs -r rm -f
            fi
          fi

          sleep 86400
        done
    depends_on:
      - postgres
    networks:
      - internal

  core:
    image: ghcr.io/unividuell/countdown-core:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Without a limit the Buildpacks memory calculator sizes the heap from the HOST's RAM. On this
    # shared box that gave BOTH stacks -Xmx20688742K (~20 GB of a 23 GB machine, measured
    # 2026-09-10) -- prod and staging each believed they owned it, and both run with
    # -XX:+ExitOnOutOfMemoryError. The limit is what the calculator divides up: 2g leaves ~1.4 GB
    # heap against a ~715 MB working set. Staging shares the default on purpose, so a limit that is
    # too tight fails there before it reaches prod. Defaulted, not required: a new mandatory
    # variable could not be staging-deployed until update.sh reached main (see deployment-server.md).
    mem_limit: ${CORE_MEM_LIMIT:-2g}
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-production}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SUPER_ADMIN_GITHUB_LOGINS=${SUPER_ADMIN_GITHUB_LOGINS:-}
      - GUESS_HUE_DATASET_PATH=/config/guess-hue-dataset.yaml
      - SPOT_OBJECT_TERMS_PATH=/config/spot-object-terms.yaml
      - SPOT_OBJECT_MAPS_API_KEY=${SPOT_OBJECT_MAPS_API_KEY}
      - SPOT_OBJECT_SERVER_MAPS_API_KEY=${SPOT_OBJECT_SERVER_MAPS_API_KEY}
      - SPOT_OBJECT_SIGNING_SECRET=${SPOT_OBJECT_SIGNING_SECRET}
    volumes:
      # update.sh decrypts to here before calling `compose up`. Read-only: the app reads the
      # dataset and never writes it. Missing file aborts the start -- intentional, a game running
      # on placeholder content looks healthy and isn't.
      # Per-target filename via GUESS_HUE_DATASET_FILE: both stacks share this directory, and a
      # shared name would mean e.g. a staging update swaps out the plaintext file prod has
      # mounted, without prod ever knowing. update.sh sets and exports this variable itself
      # (the shell environment outranks --env-file) -- it's deliberately absent from
      # .env.<target>.example. Anyone calling compose by hand without update.sh must export it
      # themselves; the message below is for exactly that case.
      - ${GUESS_HUE_DATASET_FILE:?GUESS_HUE_DATASET_FILE is not set -- export it yourself, or run this via deploy/update.sh, see deploy/README.md}:/config/guess-hue-dataset.yaml:ro
      # Same shape as the Guess Hue mount above: update.sh decrypts the Weltanschauung term list
      # to here via SPOT_OBJECT_TERMS_FILE.
      - ${SPOT_OBJECT_TERMS_FILE:?SPOT_OBJECT_TERMS_FILE is not set -- export it yourself, or run this via deploy/update.sh, see deploy/README.md}:/config/spot-object-terms.yaml:ro
    depends_on:
      - postgres
    networks:
      - internal

  caddy:
    image: ghcr.io/unividuell/countdown-web:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-countdown}-web
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - core
    networks:
      - edge      # reachable by the shared edge (reverse_proxy countdown-web:80)
      - internal  # to reach core:8080

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: [debug]
    restart: unless-stopped
    environment:
      # Desktop mode: NO pgAdmin login screen and no master-password prompt. The SSH boundary
      # + loopback bind already gate access (anyone past SSH can read the secrets anyway), so an
      # extra pgAdmin login adds no security, only friction.
      - 'PGADMIN_CONFIG_SERVER_MODE=False'
      - 'PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False'
      # The desktop auto-login identity must match the entrypoint user (PGADMIN_DEFAULT_EMAIL),
      # else pgAdmin looks up its default 'pgadmin4@pgadmin.org', misses, and 401s.
      # PGADMIN_CONFIG_* values are written into a Python config verbatim → string values need
      # embedded quotes (booleans like False are valid Python as-is).
      - "PGADMIN_CONFIG_DESKTOP_USER='${PGADMIN_EMAIL}'"
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - internal

configs:
  pgadmin_servers:
    content: |
      {
        "Servers": { "1": {
          "Name": "countdown app (postgres)", "Group": "Servers",
          "Host": "postgres", "Port": 5432, "MaintenanceDB": "app",
          "Username": "admin", "SSLMode": "prefer"
        } }
      }

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  pgadmin-data:

networks:
  edge:
    external: true
  internal:
    driver: bridge
