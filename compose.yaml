# Compose project name — otherwise derived from the dir (countdown.unividuell.org ->
# countdownunividuellorg). Yields countdown-postgres-1, countdown_default, etc.
name: countdown

services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=app'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=admin'
    # Host port: POSTGRES_PORT unset -> '0' -> Docker picks a free port (no collisions
    # when running many projects at once). Set POSTGRES_PORT in .env for a STABLE port
    # (e.g. a fixed IntelliJ DB connection). Spring + external tools then share it.
    ports:
      - '${POSTGRES_PORT:-0}:5432'
    volumes:
      # Without this, postgres:18's own `VOLUME /var/lib/postgresql` gives the container an
      # ANONYMOUS volume: `docker compose down` then orphans it, the next `up` creates a fresh
      # one, and the database looks wiped. Named, it is reattached instead. Mount the path the
      # image declares, not PGDATA (/var/lib/postgresql/18/docker) -- 18 moved it, and mounting
      # the inner path leaves the outer one unprotected.
      - 'postgres-data:/var/lib/postgresql'

  pgadmin:
    image: 'dpage/pgadmin4:latest'
    environment:
      # Desktop mode: single-user, NO pgAdmin login screen and no master-password prompt.
      - 'PGADMIN_CONFIG_SERVER_MODE=False'
      - 'PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False'
      # The desktop auto-login identity must match the user the entrypoint creates
      # (PGADMIN_DEFAULT_EMAIL); otherwise pgAdmin looks up its default
      # 'pgadmin4@pgadmin.org', doesn't find it, and returns 401.
      # PGADMIN_CONFIG_* values are written into a Python config file verbatim, so string
      # values must carry embedded quotes (booleans like False are valid Python as-is).
      - "PGADMIN_CONFIG_DESKTOP_USER='admin@local.dev'"
      - 'PGADMIN_DEFAULT_EMAIL=admin@local.dev'
      - 'PGADMIN_DEFAULT_PASSWORD=secret'
    # Bound to localhost only — desktop mode has no auth, so don't expose it on the network.
    # PGADMIN_PORT unset -> random; set it in .env for a stable URL.
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-0}:80'
    # servers.json is injected as an inline config (no host bind mount), so it works
    # regardless of Docker Desktop file-sharing (the project lives under /opt).
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    volumes:
      # persist pgAdmin state (incl. a saved DB password) across restarts
      - 'pgadmin-data:/var/lib/pgadmin'
    depends_on:
      - postgres

  # Grafana's all-in-one dev stack: OTel collector, Prometheus, Loki, Tempo, Grafana.
  # Boot's docker-compose support recognises the image and points the app's OTLP
  # exporters at it (metrics, traces, logs). Grafana needs no login.
  # GRAFANA_PORT unset -> random; set it in .env for a stable URL.
  lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-0}:3000'
      # OTLP gRPC + HTTP on random host ports; Boot reads the mapping.
      - '127.0.0.1::4317'
      - '127.0.0.1::4318'
    configs:
      - source: grafana_countdown_provider
        target: /otel-lgtm/grafana/conf/provisioning/dashboards/countdown.yaml
      - source: grafana_countdown_dashboard
        target: /otel-lgtm/countdown-dashboard.json
    volumes:
      # Keeps metrics, logs and traces across restarts.
      - 'lgtm-data:/data'

configs:
  grafana_countdown_provider:
    content: |
      apiVersion: 1
      providers:
        - name: countdown
          type: file
          options:
            path: /otel-lgtm/countdown-dashboard.json
  # One panel per line. Metric names as Prometheus sees them after the OTLP translation
  # (`http.server.requests` -> `http_server_requests_milliseconds_*`). `$$` is compose's escape for `$`.
  # The log panels stay empty locally: logs reach Loki only on the server, via docker's log files.
  grafana_countdown_dashboard:
    content: |
      {
        "uid": "countdown",
        "title": "countdown",
        "tags": ["countdown"],
        "timezone": "browser",
        "refresh": "10s",
        "time": {"from": "now-1h", "to": "now"},
        "schemaVersion": 39,
        "templating": {"list": [{"name": "env", "label": "Umgebung", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "refresh": 2, "query": {"qryType": 1, "query": "label_values(countdown_users_online{service_namespace=\"countdown\"}, deployment_environment_name)", "refId": "env"}, "definition": "label_values(countdown_users_online{service_namespace=\"countdown\"}, deployment_environment_name)"}]},
        "panels": [
          {"type": "stat", "title": "Spielen gerade (5 min)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "countdown_players_active{service_namespace=\"countdown\", deployment_environment_name=\"$$env\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "none", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}, "id": 1},
          {"type": "stat", "title": "Online (5 min)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "countdown_users_online{service_namespace=\"countdown\", deployment_environment_name=\"$$env\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "none", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}, "id": 2},
          {"type": "stat", "title": "Requests / min", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(http_server_requests_milliseconds_count{service_namespace=\"countdown\", deployment_environment_name=\"$$env\", uri!~\"/actuator.*\"}[1m])) * 60", "instant": true}], "fieldConfig": {"defaults": {"unit": "none", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}, "id": 3},
          {"type": "stat", "title": "5xx (1 h)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(increase(http_server_requests_milliseconds_count{service_namespace=\"countdown\", deployment_environment_name=\"$$env\", status=~\"5..\"}[1h])) or vector(0)", "instant": true}], "fieldConfig": {"defaults": {"unit": "none", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}, "id": 4},
          {"type": "timeseries", "title": "Spieler & Online", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "countdown_players_active{service_namespace=\"countdown\", deployment_environment_name=\"$$env\"}", "legendFormat": "spielen"}, {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "countdown_users_online{service_namespace=\"countdown\", deployment_environment_name=\"$$env\"}", "legendFormat": "online"}], "fieldConfig": {"defaults": {"unit": "none", "custom": {"fillOpacity": 15, "stacking": {"mode": "none"}}}, "overrides": []}, "id": 5},
          {"type": "timeseries", "title": "Requests / min nach Status", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (status) (rate(http_server_requests_milliseconds_count{service_namespace=\"countdown\", deployment_environment_name=\"$$env\", uri!~\"/actuator.*\"}[1m])) * 60", "legendFormat": "{{status}}"}], "fieldConfig": {"defaults": {"unit": "none", "custom": {"fillOpacity": 15, "stacking": {"mode": "normal"}}}, "overrides": []}, "id": 6},
          {"type": "timeseries", "title": "p95-Latenz je Endpoint", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_milliseconds_bucket{service_namespace=\"countdown\", deployment_environment_name=\"$$env\", uri!~\"/actuator.*\"}[5m])))", "legendFormat": "{{uri}}"}], "fieldConfig": {"defaults": {"unit": "ms", "custom": {"fillOpacity": 15, "stacking": {"mode": "none"}}}, "overrides": []}, "id": 7},
          {"type": "timeseries", "title": "Log-Zeilen / min nach Level", "datasource": {"type": "loki", "uid": "loki"}, "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum by (detected_level) (count_over_time({service_namespace=\"countdown\", service_name=\"core\", deployment_environment_name=\"$$env\"}[1m]))", "legendFormat": "{{detected_level}}"}], "fieldConfig": {"defaults": {"unit": "none", "custom": {"fillOpacity": 15, "stacking": {"mode": "normal"}}}, "overrides": []}, "id": 8},
          {"type": "timeseries", "title": "JVM-Speicher", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (area) (jvm_memory_used_bytes{service_namespace=\"countdown\", deployment_environment_name=\"$$env\"})", "legendFormat": "{{area}}"}], "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"fillOpacity": 15, "stacking": {"mode": "none"}}}, "overrides": []}, "id": 9},
          {"type": "timeseries", "title": "DB-Verbindungen", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "hikaricp_connections_active{service_namespace=\"countdown\", deployment_environment_name=\"$$env\"}", "legendFormat": "aktiv"}, {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "hikaricp_connections_pending{service_namespace=\"countdown\", deployment_environment_name=\"$$env\"}", "legendFormat": "wartend"}], "fieldConfig": {"defaults": {"unit": "none", "custom": {"fillOpacity": 15, "stacking": {"mode": "none"}}}, "overrides": []}, "id": 10},
          {"type": "logs", "title": "Fehler & Warnungen", "datasource": {"type": "loki", "uid": "loki"}, "gridPos": {"x": 0, "y": 28, "w": 24, "h": 10}, "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "{service_namespace=\"countdown\", service_name=\"core\", deployment_environment_name=\"$$env\"} | detected_level=~\"ERROR|WARN\""}], "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true}, "id": 11},
          {"type": "logs", "title": "Alle Logs", "datasource": {"type": "loki", "uid": "loki"}, "gridPos": {"x": 0, "y": 38, "w": 24, "h": 14}, "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "{service_namespace=\"countdown\", service_name=\"core\", deployment_environment_name=\"$$env\"}"}], "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true}, "id": 12}
        ]
      }
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "countdown app (postgres)",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "app",
            "Username": "admin",
            "SSLMode": "prefer"
          }
        }
      }

volumes:
  postgres-data:
  pgadmin-data:
  lgtm-data:
